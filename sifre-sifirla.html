<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="auth_shell" name="shell-type">
  <title>Şifre Sıfırlama | avrupatirsoforu.com</title>
  <link rel="icon" href="assets/logo.png?v=20261025_v9">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "warning-amber": "#FEA619",
            "warning-amber-hover": "#D97706",
            "canvas-dark": "#020617",
            "primary-container": "#131b2e",
            "secondary-container": "#fea619",
            "surface-card": "#FFFFFF",
            "surface-subtle": "#F8FAFC",
            "status-success": "#34D399"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>

<body class="bg-slate-950 font-body text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient Logistics Glows -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-xl relative z-10 flex flex-col gap-6">

    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center gap-2">
      <a href="index.html" class="flex items-center gap-2 group mb-2">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-bold">
          <span class="material-symbols-outlined text-[24px]">local_shipping</span>
        </div>
        <div class="flex flex-col text-left">
          <span class="text-white font-extrabold text-lg tracking-tight uppercase">avrupatirsoforu</span>
          <span class="text-amber-500 text-[10px] font-bold tracking-widest uppercase">Şoför Portali</span>
        </div>
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Yeni Şifre Belirleyin</h1>
      <p class="text-sm text-slate-400">
        Hesabınız için yeni ve güvenli bir şifre oluşturun.
      </p>
    </div>

    <!-- Feedback Message Container -->
    <div id="feedbackBox" class="hidden p-3.5 rounded-xl text-sm font-medium flex items-center gap-2"></div>

    <!-- Reset Form -->
    <form id="resetForm" onsubmit="handlePasswordReset(event)" class="flex flex-col gap-4">
      
      <!-- Email Field (Readonly) -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300">Kayıtlı E-posta Adresi</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-[20px]">mail</span>
          <input type="email" id="resetEmail" required readonly class="w-full h-11 pl-11 pr-4 rounded-xl bg-slate-800/60 border border-slate-700/80 text-slate-300 text-sm outline-none cursor-not-allowed">
        </div>
      </div>

      <!-- New Password Field -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300" for="newPassword">Yeni Şifreniz</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-[20px]">lock</span>
          <input type="password" id="newPassword" required minlength="6" placeholder="En az 6 karakter" class="w-full h-11 pl-11 pr-11 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
          <button type="button" onclick="togglePassVisibility('newPassword', this)" class="absolute right-3.5 text-slate-400 hover:text-white cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300" for="confirmPassword">Yeni Şifreniz (Tekrar)</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-[20px]">lock_reset</span>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Şifrenizi tekrar yazın" class="w-full h-11 pl-11 pr-11 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
          <button type="button" onclick="togglePassVisibility('confirmPassword', this)" class="absolute right-3.5 text-slate-400 hover:text-white cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full h-12 mt-2 rounded-xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-slate-950 font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">task_alt</span>
        <span>Şifreyi Güncelle &amp; Giriş Yap</span>
      </button>

    </form>

    <!-- Back to Login -->
    <div class="text-center pt-2 border-t border-slate-800">
      <a href="surucu-paneli.html" class="inline-flex items-center gap-1.5 text-xs text-amber-500 hover:text-amber-400 font-semibold transition-colors">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Sürücü Giriş Ekranına Dön</span>
      </a>
    </div>

  </div>

  <!-- Realtime Sync & Hosting API script -->
  <script src="js/cloud-db.js?v=20261025_v9"></script>

  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function showFeedback(msg, isSuccess = false) {
      const box = document.getElementById('feedbackBox');
      box.classList.remove('hidden', 'bg-red-500/15', 'text-red-400', 'border', 'border-red-500/30', 'bg-emerald-500/15', 'text-emerald-400', 'border-emerald-500/30');
      if (isSuccess) {
        box.classList.add('bg-emerald-500/15', 'text-emerald-400', 'border', 'border-emerald-500/30');
        box.innerHTML = `<span class="material-symbols-outlined text-[18px]">check_circle</span><span>${msg}</span>`;
      } else {
        box.classList.add('bg-red-500/15', 'text-red-400', 'border', 'border-red-500/30');
        box.innerHTML = `<span class="material-symbols-outlined text-[18px]">error</span><span>${msg}</span>`;
      }
    }

    // Read email & token from URL query string
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email') || '';
      const emailInput = document.getElementById('resetEmail');
      if (emailInput && email) {
        emailInput.value = email;
      }
    });

    async function handlePasswordReset(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      if (!newPassword || newPassword.length < 6) {
        showFeedback('Şifreniz en az 6 karakter olmalıdır.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showFeedback('Girilen şifreler birbiriyle eşleşmiyor.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span><span>Güncelleniyor...</span>';

      // 1. Fetch fresh applications from Cloud DB / Hosting API
      let apps = [];
      try {
        const resp = await fetch('https://avrupatirsoforu.com/api/applications.php', { cache: 'no-store' });
        const resJson = await resp.json();
        if (resJson && resJson.data && Array.isArray(resJson.data)) {
          apps = resJson.data;
        }
      } catch(err) {
        try {
          const str = localStorage.getItem('ats_applications');
          if (str) apps = JSON.parse(str);
        } catch(e) {}
      }

      // 2. Find Candidate
      let candidate = apps.find(a => a.email && a.email.toLowerCase() === email.toLowerCase());

      if (!candidate) {
        showFeedback('Bu e-posta adresine ait kayıtlı sürücü hesabı bulunamadı.');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">task_alt</span><span>Şifreyi Güncelle &amp; Giriş Yap</span>';
        return;
      }

      // 3. Update password in candidate record
      candidate.password = newPassword;
      candidate.resetToken = null;
      candidate.updatedAt = new Date().toISOString();

      try {
        const idx = apps.findIndex(a => a.id === candidate.id || a.email === candidate.email);
        if (idx !== -1) apps[idx] = candidate;
        localStorage.setItem('ats_applications', JSON.stringify(apps));
      } catch(e) {}

      // 4. Save to hosting API via PUT
      try {
        await fetch('https://avrupatirsoforu.com/api/applications.php', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(candidate)
        });
      } catch(e) {}

      showFeedback('Şifreniz başarıyla güncellendi! Giriş ekranına yönlendiriliyorsunuz...', true);

      setTimeout(() => {
        window.location.href = 'surucu-paneli.html?status=reset_success';
      }, 1500);
    }
  </script>
</body>
</html>
