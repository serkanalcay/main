<!DOCTYPE html>
<html lang="tr" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

<body class="h-full bg-slate-950 font-sans antialiased text-white selection:bg-amber-400 selection:text-slate-900 flex flex-col justify-between items-center min-h-screen relative overflow-hidden select-none p-6 sm:p-10">

  <!-- Background Ambient Glow & Film -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[140px]"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[140px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-30"></div>
  </div>

  <!-- Header Logo -->
  <header class="relative z-10 w-full max-w-5xl flex items-center justify-between py-4">
    <div class="inline-flex items-center gap-3">
      <img src="assets/avrupa_tir_soforu_logo.png" onerror="this.onerror=null; this.src='https://lh3.googleusercontent.com/aida/AEtjO1U16mn9a3n_4tV50zHQmDkkAFmlM2JmRraNMKh2IzzP1XDe3HEl6s60v2AS_I-Ldjm-xhCl5oK8jIgIZz-q9DPtS2bR_YWl3itzt65SDjQTDFx2imueVOK5rw7KJGH1l5xLafa41I7SSpOz2-GLJusY0HOupypaqDhC1rm1XFBU-A79ZVt3jVxnEZ3sSm-0d9JALL5Xij7qT6bOE5TWrig1Tr4IIQ5lQq-AysUhQvm958PNeB89NUWh_w';" alt="Avrupa Tır Şoförü Logo" class="h-10 md:h-12 w-auto object-contain">
      <span class="font-extrabold text-white text-base tracking-tight hidden sm:inline">AVRUPA TIR ŞOFÖRÜ</span>
    </div>

    <!-- Live Status Indicator -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/90 border border-slate-800 text-amber-400 text-xs font-bold uppercase tracking-wider backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      <span>Yapım Aşamasında</span>
    </div>
  </header>

  <!-- CENTER GIANT TEXT HERO -->
  <main class="relative z-10 my-auto text-center max-w-4xl px-4 flex flex-col items-center justify-center space-y-8">
    
    <!-- Big Warning Badge -->
    <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-sm font-extrabold tracking-wider uppercase backdrop-blur-xl shadow-2xl">
      <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>

    <!-- GIANT MAIN HEADING -->
    <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tight text-white leading-none uppercase drop-shadow-2xl">
      SİTEMİZ ŞU AN <br />
      <span class="bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 bg-clip-text text-transparent">HAZIRLANIYOR</span>
    </h1>

    <!-- Subtitle -->
    <p class="text-lg sm:text-2xl text-slate-300 font-semibold max-w-2xl mx-auto leading-relaxed tracking-wide">
      Çok Yakında Hizmetinizdeyiz.
    </p>

    <!-- Simple WhatsApp Support Button -->
    <div class="pt-4">
      <a 
        href="https://wa.me/908508400000" 
        target="_blank"
        class="inline-flex items-center gap-3 px-8 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-base shadow-2xl shadow-emerald-600/30 transition-all transform hover:scale-105 active:scale-95"
      >
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.149 4.192 4.192-1.135z"/>
        </svg>

      </a>
    </div>

  </main>

  <!-- Footer with Discreet Admin Entrance -->
  <footer class="relative z-10 w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between py-4 text-xs text-slate-500 gap-3 border-t border-slate-900">
    <span>© 2026 avrupatirsoforu.com • Tüm Hakları Saklıdır.</span>
    <a href="login.html?tab=admin" class="text-slate-600 hover:text-slate-400 transition-colors font-medium">🔐 Yönetici Girişi</a>
  </footer>

  <!-- GLOBAL CLOUD DATABASE ENGINE -->
  <script src="js/cloud-db.js?v=2.7.0"></script>
  <script src="js/app.js?v=2.7.0"></script>

</html>
